<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 520 340"
  width="520"
  height="340"
  role="img"
  aria-labelledby="movie-night-title movie-night-desc"
>
  <title id="movie-night-title">The club screening room</title>
  <desc id="movie-night-desc">
    A retro television showing a moonlit mountain, with rabbit-ear antennae, a VHS tape, a bucket
    of popcorn, and a starry night sky.
  </desc>

  <defs>
    <linearGradient id="movie-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0618" />
      <stop offset="0.6" stop-color="#2a1048" />
      <stop offset="1" stop-color="#3b1f5e" />
    </linearGradient>
    <radialGradient id="movie-moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.7" />
      <stop offset="0.55" stop-color="#ffe14d" stop-opacity="0.2" />
      <stop offset="1" stop-color="#ffe14d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="movie-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35f0e0" />
      <stop offset="0.55" stop-color="#12806d" />
      <stop offset="1" stop-color="#083b36" />
    </linearGradient>
    <linearGradient id="movie-tv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2a6e" />
      <stop offset="1" stop-color="#241242" />
    </linearGradient>
    <linearGradient id="movie-tape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b1f5e" />
      <stop offset="1" stop-color="#140c2e" />
    </linearGradient>
    <linearGradient id="movie-popcorn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3d" />
      <stop offset="1" stop-color="#d7263d" />
    </linearGradient>
    <filter id="movie-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="5" stdDeviation="0" flood-color="#0a0518" flood-opacity="0.4" />
    </filter>
    <g id="movie-star">
      <path d="M0 -5 L1.5 -1.5 L5 0 L1.5 1.5 L0 5 L-1.5 1.5 L-5 0 L-1.5 -1.5 Z" />
    </g>
  </defs>

  <rect width="520" height="340" rx="10" fill="url(#movie-sky)" />

  <g fill="#fff6d8" opacity="0.9">
    <circle cx="34" cy="42" r="1.7" />
