    </filter>
  </defs>

  <ellipse cx="210" cy="250" rx="185" ry="34" fill="url(#felt)" opacity="0.22" />
  <ellipse cx="210" cy="238" rx="170" ry="42" fill="url(#felt)" stroke="#082f2f" stroke-width="4" />

