title: Cobb Bridge Club
description: A friendly little club for people learning to play bridge in Cobb, California.
lang: en
timezone: America/Los_Angeles
markdown: kramdown

# The site is served from the domain root. Internal links and assets are
# passed through Jekyll's relative_url filter, so they stay root-relative.
baseurl: ''

# The site is built by the custom GitHub Actions workflow in
# .github/workflows/pages.yml, which regenerates the night-hike almanac before
# Jekyll runs. The workflow installs no Jekyll plugins, so a plain local
# `jekyll build` matches the deployed output.
exclude:
  - AGENTS.md
  - .editorconfig
  - .gitignore
  - .prettierignore
  - .prettierrc
  - .playwright-mcp
  - .DS_Store
  - '*.log'
  - .github
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - scripts
  - node_modules
  - vendor
