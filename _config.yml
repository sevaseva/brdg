title: Cobb Bridge Club
description: A friendly little club for people learning to play bridge in Cobb, California.
lang: en
timezone: America/Los_Angeles
markdown: kramdown

# The site is served from the domain root. Internal links and assets are
# passed through Jekyll's relative_url filter, so they stay root-relative.
baseurl: ''

# Absolute origin, used only for <link rel="canonical">. Keep it in step with
# the CNAME file; `relative_url` handles everything else, so links never depend
# on this value.
url: 'https://brdg.lol'

# Session notes. Each file lives in _sessions/ as a normal Markdown document
# with `session` and `date` front matter. The collection itself is not output;
# the thin pages under s/ render the matching document at more than one URL.
collections:
  sessions:
    output: false

# The site is built by the custom GitHub Actions workflow in
# .github/workflows/pages.yml, which regenerates the night-hike almanac before
# Jekyll runs. The workflow pins the same Jekyll version used locally and
# installs no plugins, so a plain local `jekyll build` matches the deployment.
exclude:
  - AGENTS.md
  - NIGHT.md
  - .editorconfig
  - .gitignore
  - .prettierignore
  - .prettierrc
  - .playwright-mcp
  - .DS_Store
  - '*.log'
  - .github
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - scripts
  - node_modules
  - vendor
