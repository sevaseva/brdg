title: Cobb Bridge Club
description: A friendly little club for people learning to play bridge in Cobb, California.
lang: en
timezone: America/Los_Angeles
markdown: kramdown

# The site is served from the domain root. Internal links and assets are
# passed through Jekyll's relative_url filter, so they stay root-relative.
baseurl: ''

# GitHub Pages builds this site with its native Jekyll pipeline.
# Keep the site plugin-free and pass internal URLs through relative_url.
exclude:
  - AGENTS.md
  - README.md
  - .editorconfig
  - .gitignore
  - .prettierignore
  - .prettierrc
  - .playwright-mcp
  - .DS_Store
  - '*.log'
  - .github
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
