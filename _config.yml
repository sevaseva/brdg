title: Cobb Bridge Club
description: A friendly little club for people learning to play bridge in Cobb, California.
lang: en
timezone: America/Los_Angeles
markdown: kramdown

# The site is served from the domain root. Internal links and assets are
# passed through Jekyll's relative_url filter, so they stay root-relative.
baseurl: ''

# GitHub Pages builds this site with its native Jekyll pipeline.
# The site is currently plugin-free and we pass internal URLs through relative_url.
# But if and when we transition to custom Actions wodkflow jekyll build,
# then we can use plugins and everything else that allows us to do while we keep deploying to GitHub Pages.
exclude:
  - AGENTS.md
  - .editorconfig
  - .gitignore
  - .prettierignore
  - .prettierrc
  - .playwright-mcp
  - .DS_Store
  - '*.log'
  - .github
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
