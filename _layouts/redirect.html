---
layout: null
---
<!doctype html>
<html lang="en">
  <head>
    {% if site.google_analytics %}
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', '{{ site.google_analytics }}');
    </script>
    {% endif %}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml" />
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}" />
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}" />
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <p>
      This page has moved <a href="{{ page.redirect_to | relative_url }}">here</a>.
    </p>
  </body>
</html>
