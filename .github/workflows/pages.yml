name: Build and deploy site

on:
  push:
    branches:
      - master
  schedule:
    # Refresh the 90-day chart once a month so it never runs dry. 08:17 UTC is
    # just after midnight in Cobb for most of the year, and even a late or
    # skipped run leaves about two months of chart behind it.
    - cron: '17 8 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Same major version as the local toolchain. Node only runs the
          # night-hike generator; Jekyll itself is Ruby.
          node-version: '26'
          cache: npm

      - name: Install build tooling
        run: npm ci

      - name: Generate the night-hike almanac
        run: npm run generate:night-hikes

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      # Pin the same Jekyll as the local toolchain. See AGENTS.md for why this
      # is not actions/jekyll-build-pages.
      - name: Install Jekyll
        run: gem install jekyll -v 4.4.1 --no-document

      - name: Build with Jekyll
        run: jekyll build --trace

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
